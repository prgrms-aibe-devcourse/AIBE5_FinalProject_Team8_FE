server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 정적 리소스 전송량 최적화
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff2;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 캐시 최적화
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
